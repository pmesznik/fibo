[package]
name = "fibo"
version = "0.4.0"
edition = "2021"
license = "GPL-2.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.6"
trash = "5"
# Rozpoznawanie twarzy: czysty Rust, wszystko liczone lokalnie (bez bibliotek sieciowych).
tract-onnx = "0.23"
sha2 = "0.10"

# Dekodowanie obrazów w trybie dev jest bez optymalizacji bardzo wolne.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

# Szyfrowanie danych twarzy kluczem konta Windows (DPAPI).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
