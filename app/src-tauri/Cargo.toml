[package]
name = "fibo"
version = "0.4.14"
edition = "2021"
license = "GPL-2.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# „Pokaż w Eksploratorze” oraz otwieranie zdjęcia z biblioteki w domyślnym programie (po numerze zdjęcia, nigdy po adresie z interfejsu).
tauri-plugin-opener = "2"
# Tylko semafor ograniczający liczbę równoległych miniatur (tokio i tak jest w Tauri).
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "tga", "pnm", "dds", "hdr", "qoi", "exr"] }
kamadak-exif = "0.6"
trash = "5"
# Rozpoznawanie twarzy: czysty Rust, wszystko liczone lokalnie (bez bibliotek sieciowych).
tract-onnx = "0.23"
# Szybkie dekodowanie JPEG ze zmniejszaniem w trakcie (bez wielowątkowości w środku: wątki daje analiza zdjęć).
jpeg-decoder = { version = "0.3", default-features = false }
sha2 = "0.10"
jxl-oxide = { version = "0.12.6", features = ["image"] }
psd = "0.3.5"
heic-decoder = "0.1.1"
rawler = "0.8.0"

# Dekodowanie obrazów w trybie dev jest bez optymalizacji bardzo wolne.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

# Szyfrowanie danych twarzy kluczem konta Windows (DPAPI).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
