name: Testy FIBO

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/tests.yml', 'SECURITY.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-types:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, kanał ustawiony niżej
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: app/src-tauri

      - name: Instalacja zależności (bez skryptów instalacyjnych)
        run: npm ci --ignore-scripts

      - name: Modele rozpoznawania twarzy (pobranie z weryfikacją SHA256)
        run: node scripts/fetch-models.mjs

      - name: Kontrola typów (TypeScript)
        run: npx tsc -b

      - name: Testy bezpieczeństwa i konfiguracji (Node)
        run: node --test "tests/*.test.mjs"

      - name: Testy Rusta (skaner, metadane XMP, odporność parserów, pliki, albumy, duplikaty)
        working-directory: app/src-tauri
        run: cargo test
