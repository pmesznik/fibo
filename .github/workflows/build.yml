name: Build FIBO (Windows)

on:
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions (tylko artefakt)
  push:
    tags: ['v*']            # tag vX.Y.Z buduje instalator i publikuje wydanie z aktualizacją

permissions:
  contents: write           # potrzebne do utworzenia wydania

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Sprawdzenie numeru wersji i obecności klucza
        id: ver
        shell: bash
        env:
          # Tu klucz służy tylko do sprawdzenia, czy istnieje; do podpisu trafia dopiero w osobnym kroku.
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME nie zgadza się z wersją $VERSION w tauri.conf.json (uruchom: node scripts/bump-version.mjs X.Y.Z)"
            exit 1
          fi
          if [[ "$HAS_KEY" != "true" ]]; then
            echo "Brak sekretu TAURI_SIGNING_PRIVATE_KEY: ustaw go w Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, kanał ustawiony niżej
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: app/src-tauri

      - name: Instalacja zależności (bez skryptów instalacyjnych)
        run: npm ci --ignore-scripts

      # Modele są pobierane tu, przy budowaniu, z weryfikacją SHA256, i dołączane do instalatora. Program nie pobiera ich sam.
      - name: Modele rozpoznawania twarzy (pobranie z weryfikacją SHA256)
        run: node scripts/fetch-models.mjs

      # Budowanie bez klucza podpisu: kod zależności (skrypty budowania Rusta, narzędzia npm) nigdy go nie widzi.
      - name: Budowanie instalatora (NSIS), bez podpisu aktualizacji
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Klucz jest dostępny tylko w tym jednym kroku, który podpisuje gotowy instalator.
      - name: Podpis aktualizacji kluczem FIBO
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXE="src-tauri/target/release/bundle/nsis/FIBO_${{ steps.ver.outputs.version }}_x64-setup.exe"
          test -f "$EXE" || { echo "Brak instalatora $EXE"; exit 1; }
          npx tauri signer sign "$EXE"
          test -s "$EXE.sig" || { echo "Podpis nie powstał"; exit 1; }

      - name: Zapis instalatora jako artefaktu
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: FIBO-instalator
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - name: Notatki wydania i latest.json (tylko dla tagów)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body || true)
          export NOTES
          node scripts/make-latest-json.mjs "${{ github.repository }}" "src-tauri/target/release/bundle/nsis/latest.json"

      - name: Wydanie na GitHubie (tylko dla tagów)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: FIBO ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            app/src-tauri/target/release/bundle/nsis/FIBO_${{ steps.ver.outputs.version }}_x64-setup.exe
            app/src-tauri/target/release/bundle/nsis/FIBO_${{ steps.ver.outputs.version }}_x64-setup.exe.sig
            app/src-tauri/target/release/bundle/nsis/latest.json
          fail_on_unmatched_files: true
