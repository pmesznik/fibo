name: Build FIBO (Windows)

on:
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions
  push:
    tags: ['v*']            # albo po wypchnięciu tagu, np. v0.1.0

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Instalacja zależności
        run: npm ci

      - name: Budowanie instalatora (NSIS)
        run: npx tauri build

      - name: Zapis instalatora jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: FIBO-instalator
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
