name: Build FIBO (Windows)

on:
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions (tylko artefakt)
  push:
    tags: ['v*']            # tag vX.Y.Z buduje instalator i publikuje wydanie

permissions:
  contents: write           # potrzebne do utworzenia wydania

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdzenie numeru wersji
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME nie zgadza się z wersją $VERSION w tauri.conf.json (uruchom: node scripts/bump-version.mjs X.Y.Z)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Instalacja zależności
        run: npm ci

      - name: Budowanie instalatora (NSIS)
        run: npx tauri build

      - name: Zapis instalatora jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: FIBO-instalator
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Wydanie na GitHubie (tylko dla tagów)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FIBO ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: app/src-tauri/target/release/bundle/nsis/FIBO_${{ steps.ver.outputs.version }}_x64-setup.exe
          fail_on_unmatched_files: true
